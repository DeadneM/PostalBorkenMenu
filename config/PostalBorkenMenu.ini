; PostalBorkenMenu V2A42 cumulative defaults
; POSTAL: Brain-Damaged
; "Borken" is intentional: nod to POSTAL: No Regerts.
;
; IMPORTANT:
; - REMOVE -debug from the game's launch options when testing PostalBorkenMenu.
; - MenuKey controls opening/closing the menu; default F1 (112).
; - Hotkeys are polled asynchronously; they do not depend on Unity WM_KEYDOWN delivery.
; - No Crosshair refresh is event-driven in V2A8; there is no permanent IL2CPP polling loop.
; - Virtual-key codes are decimal. 0 = unbound.
; - Native commands remain intact; PostalBorkenMenu additions are separate rows.
; - H40: Skip Startup Logos is exposed in Gameplay. The checkbox persists SkipStartupLogos=1/0 and applies on next launch.
; - Arsenal intentionally excludes all _Akimbo variants; Special intentionally excludes all Dong variants.

