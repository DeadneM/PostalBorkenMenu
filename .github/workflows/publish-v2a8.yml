name: Publish V2A8 Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v2a8.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify V2A8 package
        shell: bash
        run: |
          set -euo pipefail

          cat release_payload/V2A8/part*.b64 | base64 -d > POSTAL_Brain_Damaged_PostalBorkenMenu_V2A8.zip

          echo "a9688620d5fbf70162ba9ab1f1081732cb4365821c82a59121a17274cd0b6d20  POSTAL_Brain_Damaged_PostalBorkenMenu_V2A8.zip" | sha256sum -c -

          tmp="$(mktemp -d)"
          unzip -q POSTAL_Brain_Damaged_PostalBorkenMenu_V2A8.zip -d "$tmp"

          test "$(find "$tmp" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 4
          test "$(find "$tmp" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 0
          test -f "$tmp/PostalBorkenMenu.asi"
          test -f "$tmp/PostalBorkenMenu.ini"
          test -f "$tmp/PostalBorkenMenu.log"
          test -f "$tmp/README.txt"

          echo "0ca3f8d01257b84daca0d55b9ea9fe6cea6c0f6d16ef080a83815ae33ad0706a  $tmp/PostalBorkenMenu.asi" | sha256sum -c -

          echo "Verified release contents:"
          unzip -l POSTAL_Brain_Damaged_PostalBorkenMenu_V2A8.zip

      - name: Publish V2A8 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view V2A8 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload V2A8               POSTAL_Brain_Damaged_PostalBorkenMenu_V2A8.zip               --repo "$GITHUB_REPOSITORY"               --clobber
          else
            gh release create V2A8               POSTAL_Brain_Damaged_PostalBorkenMenu_V2A8.zip               --repo "$GITHUB_REPOSITORY"               --title "PostalBorkenMenu V2A8"               --notes-file release_payload/V2A8/RELEASE_NOTES.md
          fi
