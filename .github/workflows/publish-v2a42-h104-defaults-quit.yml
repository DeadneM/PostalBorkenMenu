name: Publish H104 Defaults Quit Test
on:
  push:
    branches: [dev/v2a42-h104-defaults-quit]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: h104-build
  cancel-in-progress: true
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build ImGui ASI
        shell: cmd
        run: |
          cmake -S . -B out-cmake -A x64 -DPB_BUILD_HOOK_TESTS=ON
          cmake --build out-cmake --config Release --parallel
      - name: Isolated F3 hook fixture
        shell: cmd
        run: out-cmake\Release\WeaponRenderHookTest.exe
      - name: Timer formatting boundary tests
        shell: cmd
        run: out-cmake\Release\LevelTimerFormatTest.exe
      - name: Early quit forwarding tests (static and instance)
        shell: cmd
        run: |
          out-cmake\Release\QuitHooksTest.exe
          if errorlevel 1 exit /b 1
          out-cmake\Release\QuitHooksTest.exe instance
      - name: Defaults consistency
        shell: cmd
        run: python tests\check_defaults.py
      - name: Build unchanged DXGI loader
        shell: cmd
        run: |
          mkdir build 2>nul
          cl /nologo /c /O2 /Oi- /GS- /GR- /EHs-c- /Zl /Fo:build\dxgi_asi_loader.obj proxy\dxgi_asi_loader.cpp
          ml64 /nologo /c /Fo build\dxgi_thunks.obj proxy\dxgi_thunks.asm
          link /nologo /DLL /MACHINE:X64 /NODEFAULTLIB /ENTRY:DllMain /SUBSYSTEM:WINDOWS /OPT:REF /OPT:ICF /DEF:proxy\dxgi_proxy.def /OUT:build\dxgi.dll build\dxgi_asi_loader.obj build\dxgi_thunks.obj kernel32.lib
      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item out-cmake\Release\PostalBorkenMenu.asi package\PostalBorkenMenu.asi
          Copy-Item build\dxgi.dll package\dxgi.dll
          Copy-Item config\PostalBorkenMenu.ini package\PostalBorkenMenu.ini
          Copy-Item release\README.txt package\README.txt
          if((Get-ChildItem package -File).Count -ne 4){throw 'Expected four files'}
          Compress-Archive package\* POSTAL_Brain_Damaged_PostalBorkenMenu_V2A42_H104_DEFAULTS_EARLY_QUIT_TEST.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: H104-installable-ZIP
          path: POSTAL_Brain_Damaged_PostalBorkenMenu_V2A42_H104_DEFAULTS_EARLY_QUIT_TEST.zip
      - name: Publish release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create V2A42-H104-TEST POSTAL_Brain_Damaged_PostalBorkenMenu_V2A42_H104_DEFAULTS_EARLY_QUIT_TEST.zip --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "H104 TEST - Unbound defaults and early quit fence" --notes-file docs/H104_TEST.md --prerelease
